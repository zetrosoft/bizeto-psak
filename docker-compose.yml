services:
  bizeto-psak-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bizeto-psak-v2
    restart: always
    environment:
      - PORT=2550
      - NODE_ENV=production
      - DATABASE_URL=postgresql://jkk_user:jkk_super_secret_password@jkk-db:5432/bizeto_psak_db
      - MCP_BASE_URL=https://mcp.samkarsa.com
      - NEXT_PUBLIC_BACKEND_URL=https://psak.erpjkk.com/api
    networks:
      - erpnext-docker_traefik-ingress
      - jkk-apps-backend
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=erpnext-docker_traefik-ingress"
      # Traefik Router HTTPS untuk Domain psak.erpjkk.com
      - "traefik.http.routers.bizeto-psak-http.rule=Host(`psak.erpjkk.com`)"
      - "traefik.http.routers.bizeto-psak-http.entrypoints=web"
      - "traefik.http.routers.bizeto-psak-https.rule=Host(`psak.erpjkk.com`)"
      - "traefik.http.routers.bizeto-psak-https.entrypoints=websecure"
      - "traefik.http.routers.bizeto-psak-https.tls.certresolver=myresolver"
      - "traefik.http.services.bizeto-psak.loadbalancer.server.port=2550"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

networks:
  erpnext-docker_traefik-ingress:
    external: true
  jkk-apps-backend:
    external: true
